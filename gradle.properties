# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Multi-Loader Configuration
enabled_platforms=fabric,neoforge

# Minecraft version target
minecraft_version=26.3
minecraft_version_publish_range=~26.3

# Fabric Properties
# Check these on https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.160.7+26.3

# NeoForge version for target Minecraft version
# Check these on https://neoforged.net/
neoforge_version=26.3.0.4-beta

# Architectury Properties (for multiloader support)
architectury_plugin_version=3.5-SNAPSHOT
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=win.demistorm
archives_base_name=eip

# Vivecraft Properties (optional at runtime, compile-only in common)
vivecraft_version=1.3.16
vivecraft_mc_override=

# Dev run additional deps
modmenu_version=21.0.0
sodium_version=mc26.3-0.9.2-fabric
