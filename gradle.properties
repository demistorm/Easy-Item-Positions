# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Multi-Loader Configuration
enabled_platforms=fabric,neoforge

# Minecraft version target
minecraft_version=26.1
minecraft_version_publish_range=~26.1

# Fabric Properties
# Check these on https://fabricmc.net/develop
fabric_loader_version=0.18.6
fabric_api_version=0.145.1+26.1

# Forge version for target Minecraft version
# Check these on https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=1.21.11-61.0.3

# NeoForge version for target Minecraft version
# Check these on https://neoforged.net/
neoforge_version=26.1.0.19-beta

# Architectury Properties (for multiloader support)
architectury_plugin_version=3.5-SNAPSHOT
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=win.demistorm
archives_base_name=eip

# Vivecraft Properties (optional at runtime, compile-only in common)
vivecraft_version=1.3.15
vivecraft_mc_override=26.1.2

# Dev run additional deps
modmenu_version=18.0.2
sodium_version=mc26.1.1-0.8.9-fabric
