modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0"

[[mods]]
modId = "mcpositioneditor"
version = "${version}"
displayName = "Easy Item Positions"
authors = "Halfstorm"
description = '''
Live item position editor for flatscreen and VR
'''

[[mixins]]
config = "mcpositioneditor.mixins.json"

[[mixins]]
config = "mcpositioneditor-vivecraft.mixins.json"

[[dependencies.mcpositioneditor]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mcpositioneditor]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"

# Optional Vivecraft dependency
[[dependencies.mcpositioneditor]]
modId = "vivecraft"
mandatory = false
versionRange = "[1.3.3,)"
ordering = "NONE"
side = "CLIENT"
